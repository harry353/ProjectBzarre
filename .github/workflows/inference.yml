name: ProjectBzarre Inference

permissions:
  contents: write

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches-ignore:
      - auto_inference

jobs:
  run-inference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          activate-environment: projectbzarre
          environment-file: environment.yml
          python-version: 3.11

      - name: Verify environment
        shell: bash -l {0}
        run: |
          python --version
          python - <<EOF
          import numpy, pandas, scipy, sunpy
          print("Environment OK")
          EOF

      - name: Run full inference pipeline
        shell: bash -l {0}
        run: |
          python inference/run_full_inference.py

      - name: Commit and Push inference output
        shell: bash -l {0}
        run: |
          # 1. Identity Configuration
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 2. Ensure we are on the correct branch and have the latest remote state
          git fetch origin auto_inference
          git checkout auto_inference

          # 3. Stage the specific output files
          git add combined_predicted_dst_and_prob.png inference/space_weather_last_6m.db

          # 4. Conditional Commit and Rebase-Push
          if ! git diff --cached --quiet; then
            echo "Changes detected, committing..."
            git commit -m "Update inference plot [skip ci]"
            
            # Use rebase to put your new plot on top of any database updates 
            # pushed by other instances of this action while this one was running.
            git pull --rebase origin auto_inference
            
            git push origin auto_inference
          else
            echo "No changes in inference output. Skipping push."
          fi